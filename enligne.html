<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilisateurs en ligne - BCM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#f2f3f7}

.topbar{
height:80px;background:#0b76d1;color:#fff;
display:flex;align-items:center;padding:0 20px
}
.menu-btn{font-size:32px;cursor:pointer;margin-right:15px}
.title{font-size:20px;font-weight:600}

.dashboard{padding:20px}

.card{
background:#fff;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08)
}

.user{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid #eee;
}
.user:last-child{border:none}

.name{font-weight:600}
.uid{font-size:12px;color:#666}

.status{
font-weight:700;
margin-top:5px;
color:green;
}

.dot{
color:#00c853;
margin-right:6px;
}

/* SIDEBAR */
.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.4);
display:none;
z-index:99
}
.overlay.active{display:block}

.sidebar{
position:fixed;
left:-300px;
top:0;
width:300px;
height:100%;
background:#fff;
transition:.3s;
z-index:100
}
.sidebar.active{left:0}

.sidebar-header{
background:#0b76d1;
color:#fff;
padding:20px;
font-size:18px
}

.sidebar a{
display:block;
padding:15px;
text-decoration:none;
color:#333;
border-bottom:1px solid #eee;
font-weight:500
}
.sidebar a:hover{background:#f5f5f5}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
<div class="sidebar-header">MENU ADMIN</div>

<a href="uid.html">UID utilisateurs</a>
<a href="gestion.html">Gestion soldes</a>
<a href="supprimer.html">Supprimer compte</a>
<a href="gerehistorique.html">Gestion historique</a>
<a href="blocage.html">Blocage comptes</a>
<a href="enligne.html">Utilisateurs en ligne</a>
</div>

<div class="topbar">
<div class="menu-btn" id="menuBtn">☰</div>
<div class="title">UTILISATEURS EN LIGNE</div>
</div>

<div class="dashboard">
<div class="card" id="box">Chargement...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
getFirestore,
collection,
onSnapshot,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyC5BKPy37U7-s32GFfuRiANAofNAG2H_2g",
authDomain:"bcm-financiale-groupe.firebaseapp.com",
projectId:"bcm-financiale-groupe"
});

const db = getFirestore(app);

/* MENU */
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

document.getElementById("menuBtn").onclick=()=>{
sidebar.classList.add("active");
overlay.classList.add("active");
}

overlay.onclick=()=>{
sidebar.classList.remove("active");
overlay.classList.remove("active");
}

/* TEMPS RÉEL */
onSnapshot(collection(db,"utilisateurs"), (snap)=>{

let html="";
let count=0;

snap.forEach(docu=>{
const u = docu.data();

if(u.enLigne === true){

count++;

const last = u.derniereConnexion?.toDate
? u.derniereConnexion.toDate()
: null;

html += `
<div class="user">
<div>
<div class="name">
<span class="dot">🟢</span>
${u.prenom || ""} ${u.nom || ""}
</div>

<div class="uid">${docu.id}</div>

<div class="status">EN LIGNE</div>

${last ? `
<div class="uid">
Dernière activité : ${last.toLocaleString("fr-FR")}
</div>
` : ""}

</div>

<button class="btn" onclick="deconnecter('${docu.id}')">
Déconnecter
</button>

</div>
`;
}
});

document.getElementById("box").innerHTML =
count ? html : "Aucun utilisateur en ligne";
});

/* DECONNECTER USER */
window.deconnecter = async (uid) => {
await updateDoc(doc(db,"utilisateurs",uid),{
enLigne:false
});
}

</script>

</body>
</html>
