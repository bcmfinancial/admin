<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuler Transfert - BCM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#f2f3f7}

/* TOP */
.topbar{
height:80px;background:#0b76d1;color:#fff;
display:flex;align-items:center;padding:0 20px
}
.menu-btn{font-size:32px;cursor:pointer;margin-right:15px}
.title{font-size:20px;font-weight:600}

/* CONTENT */
.dashboard{padding:20px}

.card{
background:#fff;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08)
}

.transfer{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid #eee;
}
.transfer:last-child{border:none}

.info{
font-size:14px;
}

.amount{
font-weight:700;
color:#ff9800;
margin-top:4px;
}

.btn{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
font-size:13px;
background:red;
color:#fff;
}

/* MODAL */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.5);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.modal-content{
background:#fff;
padding:20px;
border-radius:10px;
width:320px;
text-align:center;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:15px;
}

.confirm{
background:red;
color:#fff;
}

.cancel{
background:#999;
color:#fff;
}

/* SIDEBAR */
.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.4);
display:none;
z-index:99
}
.overlay.active{display:block}

.sidebar{
position:fixed;
left:-300px;
top:0;
width:300px;
height:100%;
background:#fff;
transition:.3s;
z-index:100
}
.sidebar.active{left:0}

.sidebar-header{
background:#0b76d1;
color:#fff;
padding:20px;
font-size:18px
}

.sidebar a{
display:block;
padding:15px;
text-decoration:none;
color:#333;
border-bottom:1px solid #eee;
font-weight:500
}
.sidebar a:hover{background:#f5f5f5}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
<div class="sidebar-header">MENU ADMIN</div>

<a href="uid.html">UID utilisateurs</a>
<a href="gestion.html">Gestion soldes</a>
<a href="supprimer.html">Supprimer compte</a>
<a href="gerehistorique.html">Gestion historique</a>
<a href="blocage.html">Blocage comptes</a>
<a href="enligne.html">Utilisateurs en ligne</a>
</div>

<!-- TOP -->
<div class="topbar">
<div class="menu-btn" id="menuBtn">☰</div>
<div class="title">ANNULER TRANSFERT</div>
</div>

<!-- CONTENT -->
<div class="dashboard">
<div class="card" id="box">Chargement...</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h3>Annuler ce transfert ?</h3>

<p id="info"></p>

<div class="actions">
<button class="btn confirm" id="yes">Oui annuler</button>
<button class="btn cancel" onclick="closeModal()">Fermer</button>
</div>
</div>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc,
orderBy,
query
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

/* FIREBASE */

const app = initializeApp({
apiKey: "AIzaSyC5BKPy37U7-s32GFfuRiANAofNAG2H_2g",
authDomain:"bcm-financiale-groupe.firebaseapp.com",
projectId:"bcm-financiale-groupe"
});

const db = getFirestore(app);

/* LOAD HISTORIQUES */
async function load(){

const q = query(collection(db,"historique"), orderBy("date","desc"));
const snap = await getDocs(q);

let html="";

if(snap.empty){
document.getElementById("box").innerHTML = `
<div class="transfer">
Aucun historique trouvé
</div>`;
return;
}

snap.forEach((d)=>{

const h = d.data();

const date = h.date?.toDate ? h.date.toDate() : new Date();

html += `
<div class="transfer">

<div>
<div class="info">
<b>${h.type || "Transaction"}</b><br>
UID : ${h.uid || ""}<br>

${h.beneficiaire ? "Bénéficiaire : "+h.beneficiaire+"<br>" : ""}
${h.statut ? "Statut : "+h.statut+"<br>" : ""}

<div style="margin-top:6px;color:#777;font-size:12px">
${date.toLocaleDateString("fr-FR")} à ${date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
</div>

</div>

<div class="amount">
${Number(h.montant||0).toLocaleString("fr-FR")} ${h.devise||"EUR"}
</div>

</div>

<button class="btn"
onclick="supprimer('${d.id}')">
Supprimer
</button>

</div>
`;
});

document.getElementById("box").innerHTML = html;
}

/* DELETE */
window.supprimer = async (id) => {
await deleteDoc(doc(db,"historique",id));
load();
}

/* SIDEBAR */
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

document.getElementById("menuBtn").onclick=()=>{
sidebar.classList.add("active");
overlay.classList.add("active");
}

overlay.onclick=()=>{
sidebar.classList.remove("active");
overlay.classList.remove("active");
}

load();

</script>

</body>
</html>
